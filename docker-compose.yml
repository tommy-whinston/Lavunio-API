services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tmstore
      POSTGRES_USER: tmstore
      POSTGRES_PASSWORD: tmstore
    ports:
      - "5432:5432"
    volumes:
      - tmstore-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tmstore -d tmstore"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tmstore
      MINIO_ROOT_PASSWORD: tmstore-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - tmstore-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 tmstore tmstore-secret; do sleep 1; done;
      mc mb -p local/tmstore || true;
      mc anonymous set download local/tmstore || true;
      "

volumes:
  tmstore-db:
  tmstore-minio:
