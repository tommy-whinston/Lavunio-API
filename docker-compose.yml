services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lavunio
      POSTGRES_USER: lavunio
      POSTGRES_PASSWORD: lavunio
    ports:
      - "5432:5432"
    volumes:
      - lavunio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lavunio -d lavunio"]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: lavunio
      MINIO_ROOT_PASSWORD: lavunio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lavunio-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 lavunio lavunio-secret; do sleep 1; done;
      mc mb -p local/lavunio || true;
      mc anonymous set download local/lavunio || true;
      "

volumes:
  lavunio-db:
  lavunio-minio:
